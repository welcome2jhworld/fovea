[project]
name = "fovea-worker"
version = "0.1.0"
description = "Fovea model worker: detection, embedding and VLM inference over a loopback JSON API"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "numpy>=2.0",
  "pillow>=10.0",
]

[project.optional-dependencies]
torch = [
  "torch>=2.7",
  "torchvision>=0.22",
  "transformers==5.17.0",
  "accelerate>=1.0",
  "safetensors>=0.5",
  "rfdetr==1.10.1",
  "supervision==0.30.2",
  "qwen-vl-utils==0.0.14",
]
mlx = [
  "mlx>=0.32.2",
  "mlx-vlm==0.7.0",
  "transformers==5.17.0",
]

[project.scripts]
fovea-worker = "fovea_worker.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fovea_worker*"]
